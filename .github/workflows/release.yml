name: Build StopTime RELEASE (for Google Play)

# Run this by hand: Actions tab -> "Build StopTime RELEASE" -> "Run workflow".
# It makes a signed .aab file to upload to the Google Play Console.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Unpack the upload key (from GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. See the setup guide."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed App Bundle (.aab)
        env:
          STOPTIME_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          STOPTIME_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STOPTIME_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STOPTIME_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Upload the .aab
        uses: actions/upload-artifact@v7
        with:
          name: StopTime-Release-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
