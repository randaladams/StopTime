name: Android

# ONE workflow for everything:
#  * Every push / pull request  -> builds a TEST APK (test ads), downloadable under "Artifacts".
#  * Release for Google Play     -> Actions tab -> "Android" -> "Run workflow" -> type a version (e.g. 1.0.1).
#    It builds the signed .aab (upload this to Play Console) and a signed .apk, tags the code
#    as v1.0.1, and creates a GitHub Release with both files and a list of changes.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version for Google Play, like 1.0.1 (must be higher than the last release)"
        required: true
        type: string

permissions:
  contents: write   # needed to create the version tag and GitHub Release

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # all tags, to know the last released version

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (version comes from the Gradle wrapper)
        uses: gradle/actions/setup-gradle@v6

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
          LAST=${LAST:-1.0.0}   # 1.0.0 = the version on Google Play before automatic versioning
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            V=$(echo "$INPUT_VERSION" | tr -d ' v')
            if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$'; then
              echo "::error::Version must look like 1.0.1 (numbers only; middle and last part 0-99). Got: '$INPUT_VERSION'"; exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
              echo "::error::Version $V was already released. Use a higher number than $LAST."; exit 1
            fi
            if [ "$(printf '%s\n%s\n' "$LAST" "$V" | sort -V | tail -n1)" != "$V" ]; then
              echo "::error::Version $V is lower than the last release ($LAST). Use a higher number."; exit 1
            fi
            IFS=. read -r MA MI PA <<< "$V"
            CODE=$((MA * 10000 + 10#$MI * 100 + 10#$PA))
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            V="$LAST-test.$GITHUB_RUN_NUMBER"
            CODE=1
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "### StopTime $V (versionCode $CODE)" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: $V   versionCode: $CODE   (last release: $LAST)"

      # ---------------- test build (every push / pull request) ----------------
      - name: Build test APK
        if: steps.version.outputs.release == 'false'
        env:
          STOPTIME_VERSION_NAME: ${{ steps.version.outputs.name }}
          STOPTIME_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test APK
        if: steps.version.outputs.release == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: StopTime-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk

      # ---------------- release build (Run workflow with a version) ----------------
      - name: Unpack the upload key
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 is missing."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release (.aab for Google Play + .apk)
        if: steps.version.outputs.release == 'true'
        env:
          STOPTIME_VERSION_NAME: ${{ steps.version.outputs.name }}
          STOPTIME_VERSION_CODE: ${{ steps.version.outputs.code }}
          STOPTIME_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          STOPTIME_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STOPTIME_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STOPTIME_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/bundle/release/app-release.aab "out/StopTime-${STOPTIME_VERSION_NAME}.aab"
          cp app/build/outputs/apk/release/app-release.apk "out/StopTime-${STOPTIME_VERSION_NAME}.apk"

      - name: Remove the key file
        if: always() && steps.version.outputs.release == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload release files
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: StopTime-${{ steps.version.outputs.name }}-release
          path: out/*

      - name: Tag the code and create the GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          gh release create "v$V" out/* \
            --target "$GITHUB_SHA" \
            --title "StopTime $V" \
            --notes "versionCode $CODE. Upload StopTime-$V.aab to Google Play Console." \
            --generate-notes
