name: Build StopTime APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Free and Pro APKs
        run: gradle assembleFreeDebug assembleProDebug --stacktrace

      - name: Upload Free APK
        uses: actions/upload-artifact@v4
        with:
          name: StopTime-Free-APK
          path: app/build/outputs/apk/free/debug/*.apk

      - name: Upload Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: StopTime-Pro-APK
          path: app/build/outputs/apk/pro/debug/*.apk
